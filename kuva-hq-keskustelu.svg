<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 300" width="100%"
     preserveAspectRatio="xMidYMid meet" role="img"
     aria-labelledby="hqk-title hqk-desc">
  <title id="hqk-title">Yhteinen keskustelu ja työn loki</title>
  <desc id="hqk-desc">Yhteisellä keskustelualueella näkee, mitä on tehty ja kuka hoitaa minkäkin asian. Sieltä voi myös ottaa yhteyttä.</desc>

  <defs>
    <style>
      .hqg-h{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Inter,Helvetica,Arial,sans-serif;fill:#0d0d0f;font-size:16.5px;font-weight:600}
      .hqg-t{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Inter,Helvetica,Arial,sans-serif;fill:#0d0d0f;font-size:13.5px}
      .hqg-s{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Inter,Helvetica,Arial,sans-serif;fill:#5f6065;font-size:12.5px}
      .hqg-line{stroke:#e6e4e2;stroke-width:2.5}
      .hqg-pill{fill:#ffffff;stroke:#e6e4e2;stroke-width:1.5}
      .hqg-conn{stroke:#5f6065;stroke-width:1.5;stroke-dasharray:5 5;fill:none}
    </style>
    <marker id="hqkChk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#5f6065"></path>
    </marker>
  </defs>

  <text class="hqg-h" x="420" y="36" text-anchor="middle">Yhteinen keskustelu ja työn loki</text>
  <text class="hqg-s" x="420" y="60" text-anchor="middle">Kaikki näkevät, mitä on tehty, ja voivat ottaa yhteyttä.</text>

  <path class="hqg-line" d="M140 108 V226"></path>
  <circle cx="140" cy="112" r="9" fill="#1e3a5f"></circle>
  <text class="hqg-t" x="170" y="117">Tehtävä valmis ja tarkistettu</text>

  <circle cx="140" cy="167" r="9" fill="#f5c33b"></circle>
  <text class="hqg-t" x="170" y="172">Kysymys ja vastaus samassa ketjussa</text>

  <circle cx="140" cy="222" r="9" fill="#2f5d57"></circle>
  <text class="hqg-t" x="170" y="227">Kuka hoitaa tämän</text>

  <path class="hqg-conn" d="M470 167 H600" marker-end="url(#hqkChk)"></path>

  <rect class="hqg-pill" x="600" y="141" width="200" height="52" rx="26"></rect>
  <text class="hqg-t" x="700" y="173" text-anchor="middle">Ota yhteyttä</text>

  <text class="hqg-s" x="420" y="276" text-anchor="middle">Sama näkymä kaikille tiimeille.</text>
</svg>
