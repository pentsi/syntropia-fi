<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 300" width="100%"
     preserveAspectRatio="xMidYMid meet" role="img"
     aria-labelledby="hqk-title hqk-desc">
  <title id="hqk-title">Yhteinen keskustelu ja työn loki</title>
  <desc id="hqk-desc">Yhteisellä keskustelualueella näkee, mitä on tehty ja kuka hoitaa minkäkin asian, ja sieltä voi ottaa yhteyttä.</desc>

  <defs>
    <style>
      .hqk-h{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Inter,Helvetica,Arial,sans-serif;fill:#0d0d0f;font-size:16.5px;font-weight:600}
      .hqk-s{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Inter,Helvetica,Arial,sans-serif;fill:#5f6065;font-size:12.5px}
      .hqk-name{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Inter,Helvetica,Arial,sans-serif;fill:#5f6065;font-size:11px;font-weight:700;letter-spacing:.03em}
      .hqk-namew{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Inter,Helvetica,Arial,sans-serif;fill:#bfd6d1;font-size:11px;font-weight:700;letter-spacing:.03em}
      .hqk-msg{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Inter,Helvetica,Arial,sans-serif;fill:#0d0d0f;font-size:13px}
      .hqk-msgw{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Inter,Helvetica,Arial,sans-serif;fill:#ffffff;font-size:13px}
      .hqk-card{fill:#ffffff;stroke:#e6e4e2;stroke-width:1.5}
      .hqk-in{fill:#eef2f7;stroke:#dde4ee;stroke-width:1.5}
      .hqk-out{fill:#2f5d57}
      .hqk-btn{fill:#0d0d0f}
      .hqk-btnt{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Inter,Helvetica,Arial,sans-serif;fill:#ffffff;font-size:14px;font-weight:600}
    </style>
  </defs>

  <text class="hqk-h" x="420" y="36" text-anchor="middle">Yhteinen keskustelu ja työn loki</text>
  <text class="hqk-s" x="420" y="60" text-anchor="middle">Kaikki näkevät, mitä on tehty, kuka hoitaa, ja mistä ottaa yhteyttä.</text>

  <!-- Keskustelu-/lokikortti -->
  <rect class="hqk-card" x="56" y="84" width="452" height="196" rx="18"></rect>

  <!-- Viesti 1: saapuva -->
  <rect class="hqk-in" x="76" y="100" width="300" height="52" rx="14"></rect>
  <text class="hqk-name" x="94" y="122">AINO · MYYNTI</text>
  <text class="hqk-msg" x="94" y="140">Tehtävä valmis ja tarkistettu</text>

  <!-- Viesti 2: lähtevä -->
  <rect class="hqk-out" x="188" y="160" width="300" height="52" rx="14"></rect>
  <text class="hqk-namew" x="206" y="182">HQ-AGENTTI</text>
  <text class="hqk-msgw" x="206" y="200">Kysymys: kumpi lasku lähetetään?</text>

  <!-- Viesti 3: saapuva -->
  <rect class="hqk-in" x="76" y="220" width="300" height="52" rx="14"></rect>
  <text class="hqk-name" x="94" y="242">SANTERI · JOHTO</text>
  <text class="hqk-msg" x="94" y="260">Lähetä v2 — kuka hoitaa tämän?</text>

  <!-- Yhteydenotto -->
  <text class="hqk-s" x="672" y="166" text-anchor="middle">Yhteydenotto samasta näkymästä</text>
  <rect class="hqk-btn" x="576" y="182" width="192" height="48" rx="24"></rect>
  <text class="hqk-btnt" x="672" y="212" text-anchor="middle">Ota yhteyttä</text>
</svg>
